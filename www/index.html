<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Recados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef6ff',
                            100: '#d9eaff',
                            200: '#bcdbff',
                            300: '#8ec3ff',
                            400: '#5aa4ff',
                            500: '#2d7ff9',
                            600: '#1a63d6',
                            700: '#154fac',
                            800: '#164389',
                            900: '#173a6e',
                        },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-slate-950 text-slate-100 antialiased">
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur">
        <div class="max-w-3xl mx-auto px-4 sm:px-6 py-4 sm:py-5 flex items-center justify-center gap-2.5 sm:gap-3">
            <span class="flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-primary-500/15 text-primary-400 flex-shrink-0">
                <i data-lucide="message-square-text" class="w-4 h-4 sm:w-5 sm:h-5"></i>
            </span>
            <h1 class="text-lg sm:text-2xl font-semibold tracking-tight">Meu Projeto</h1>
        </div>
    </header>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-14">
        <p class="text-center text-sm sm:text-base text-slate-400 mb-8 sm:mb-10">
            Página servida via Nginx dentro de um container Docker.
        </p>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-xl shadow-black/20 p-5 sm:p-8">
            <div class="flex items-center gap-2 mb-5 sm:mb-6">
                <i data-lucide="pencil-line" class="w-5 h-5 text-primary-400 flex-shrink-0"></i>
                <h2 class="text-base sm:text-lg font-semibold">Mural de recados</h2>
            </div>

            <form id="recado-form" class="space-y-4 mb-8 sm:mb-9">
                <div>
                    <label for="recado-nome" class="block text-sm font-medium text-slate-300 mb-1.5">Nome</label>
                    <input type="text" id="recado-nome" placeholder="Seu nome" maxlength="80" required
                        class="w-full rounded-lg bg-slate-800/60 border border-slate-700 px-3.5 py-2.5 text-sm placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
                </div>
                <div>
                    <label for="recado-mensagem" class="block text-sm font-medium text-slate-300 mb-1.5">Mensagem</label>
                    <textarea id="recado-mensagem" placeholder="Sua mensagem" maxlength="500" rows="3" required
                        class="w-full rounded-lg bg-slate-800/60 border border-slate-700 px-3.5 py-2.5 text-sm placeholder:text-slate-500 outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition resize-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-medium text-sm px-4 py-3 sm:py-2.5 transition shadow-sm shadow-primary-900/40">
                    <i data-lucide="send" class="w-4 h-4"></i>
                    Enviar recado
                </button>
            </form>

            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="messages-square" class="w-4 h-4 text-slate-500 flex-shrink-0"></i>
                <h3 class="text-sm font-medium text-slate-400">Recados recentes</h3>
            </div>
            <ul id="recado-lista" class="space-y-3 max-h-96 overflow-y-auto pr-1"></ul>
        </div>
    </main>

    <footer class="border-t border-slate-800 py-6">
        <p class="text-center text-xs text-slate-500">&copy; 2026 - Projeto de exemplo</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
