<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Recados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eef6ff',
                            100: '#d9eaff',
                            200: '#bcdbff',
                            300: '#8ec3ff',
                            400: '#5aa4ff',
                            500: '#2d7ff9',
                            600: '#1a63d6',
                            700: '#154fac',
                            800: '#164389',
                            900: '#173a6e',
                        },
                    },
                },
            },
        };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex flex-col bg-neutral-900 text-neutral-100 antialiased">
    <header class="sticky top-0 z-30 border-b border-neutral-800 bg-neutral-900/95 backdrop-blur">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 min-w-0">
                <span class="flex items-center justify-center w-9 h-9 rounded-xl bg-primary-500/15 text-primary-400 flex-shrink-0">
                    <i data-lucide="cannabis" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </span>
                <h1 class="text-base sm:text-xl font-semibold tracking-tight truncate">Mural de Recados</h1>
            </div>
            <button id="btn-abrir-modal" type="button"
                class="inline-flex items-center gap-1.5 sm:gap-2 rounded-lg bg-primary-600 hover:bg-primary-700 active:bg-primary-800 text-white font-medium text-xs sm:text-sm px-3 sm:px-4 py-2 sm:py-2.5 transition shadow-sm shadow-primary-900/40 flex-shrink-0">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="sm:hidden">Adicionar</span>
                <span class="hidden sm:inline">Adicionar recado</span>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
            <ul id="recado-lista" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-5"></ul>
        </div>
    </main>

    <footer class="border-t border-neutral-800 py-6">
        <p class="text-center text-xs text-neutral-500">&copy; 2026 - Projeto de exemplo</p>
    </footer>

    <div id="modal-overlay" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="modal-card" class="w-full max-w-sm bg-neutral-800 border border-neutral-700 rounded-2xl shadow-2xl p-6">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i data-lucide="sticky-note" class="w-4 h-4 text-primary-400"></i>
                    Novo recado
                </h2>
                <button id="btn-fechar-modal" type="button" class="w-8 h-8 flex items-center justify-center rounded-lg text-neutral-400 hover:text-neutral-100 hover:bg-neutral-700 transition" title="Fechar">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <form id="add-form" class="space-y-4">
                <div>
                    <label for="add-nome" class="block text-sm font-medium text-neutral-300 mb-1.5">Nome</label>
                    <input type="text" id="add-nome" placeholder="Seu nome" maxlength="80" required
                        class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3.5 py-2.5 text-sm placeholder:text-neutral-500 outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition">
                </div>
                <div>
                    <label for="add-mensagem" class="block text-sm font-medium text-neutral-300 mb-1.5">Mensagem</label>
                    <textarea id="add-mensagem" placeholder="Sua mensagem" maxlength="500" rows="4" required
                        class="w-full rounded-lg bg-neutral-900 border border-neutral-700 px-3.5 py-2.5 text-sm placeholder:text-neutral-500 outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition resize-none"></textarea>
                </div>
                <div class="flex gap-2 justify-end pt-1">
                    <button type="button" id="btn-cancelar-modal" class="rounded-lg px-4 py-2.5 text-sm font-medium text-neutral-300 hover:bg-neutral-700 transition">Cancelar</button>
                    <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-primary-600 hover:bg-primary-700 text-white text-sm font-medium px-4 py-2.5 transition">
                        <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div id="confirm-overlay" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div id="confirm-card" class="w-full max-w-sm bg-neutral-800 border border-neutral-700 rounded-2xl shadow-2xl p-6">
            <div class="flex items-start gap-3 mb-5">
                <span class="flex items-center justify-center w-10 h-10 rounded-full bg-red-500/15 text-red-400 flex-shrink-0">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </span>
                <div class="min-w-0 pt-1.5">
                    <h2 class="text-base font-semibold">Excluir recado?</h2>
                    <p class="text-sm text-neutral-400 mt-0.5">Essa ação não pode ser desfeita.</p>
                </div>
            </div>
            <div class="rounded-lg bg-neutral-900 border border-neutral-700 px-3.5 py-2.5 mb-6">
                <p class="text-sm font-medium text-neutral-200" id="confirm-nome"></p>
                <p class="text-sm text-neutral-400 truncate" id="confirm-mensagem"></p>
            </div>
            <div class="flex gap-2 justify-end">
                <button type="button" id="btn-cancelar-exclusao" class="rounded-lg px-4 py-2.5 text-sm font-medium text-neutral-300 hover:bg-neutral-700 transition">Cancelar</button>
                <button type="button" id="btn-confirmar-exclusao" class="inline-flex items-center gap-2 rounded-lg bg-red-600 hover:bg-red-700 active:bg-red-800 text-white text-sm font-medium px-4 py-2.5 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> Excluir
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
